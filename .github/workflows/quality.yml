# Code-Quality-Checks bei jedem Push und Pull-Request.
# Läuft auf Ubuntu (schneller + günstiger als Windows) und prüft
# per ruff auf Syntax-, Import- und Style-Fehler.
name: Code Quality

on: [push, pull_request]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      # Actions auf Commit-Hashes festgelegt, Node-24-Versionen (siehe build-exe.yml)
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      # ruff ist ein extrem schneller Python-Linter (Rust-basiert),
      # ersetzt flake8 + isort + pyflakes in einem Tool.
      # Feste Version wie im lokalen venv: eine neuere ruff-Version kann
      # neue Regeln mitbringen und den CI-Lauf ohne Codeänderung rot färben.
      - name: Install ruff
        run: pip install ruff==0.15.2

      - name: Lint (Fehler + Warnungen)
        run: ruff check .

      - name: Format-Check (Einrückung, Zeilenumbrüche)
        run: ruff format --check .
